<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kicau Kicau Mania</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100">
    <div class="p-6">
        <h1 class="text-3xl font-bold text-green-700 mb-6">Dashboard Kicau Kicau Mania 🐦</h1>
        
        <!-- Statistik Utama -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-green-500">
                <h2 class="text-gray-500">Total Penjualan</h2>
                <p class="text-2xl font-bold">Rp 150.000.000</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-500">
                <h2 class="text-gray-500">Stok Burung</h2>
                <p class="text-2xl font-bold">45 Ekor</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-yellow-500">
                <h2 class="text-gray-500">Pelanggan Baru</h2>
                <p class="text-2xl font-bold">12 Orang</p>
            </div>
        </div>

        <!-- Grafik -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <canvas id="myChart" height="100"></canvas>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('myChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'Mei'],
                datasets: [{
                    label: 'Tren Penjualan Burung (Kicau)',
                    data: [12, 19, 3, 5, 20],
                    backgroundColor: 'rgba(34, 197, 94, 0.2)',
                    borderColor: 'rgba(34, 197, 94, 1)',
                    borderWidth: 2
                }]
            }
        });
    </script>
</body>
</html>
